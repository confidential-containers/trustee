[package]
name = "trustee-cli"
version.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true
edition.workspace = true

[[bin]]
name = "trustee"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
attestation-service = { path = "../../attestation-service", default-features = false }
clap = { workspace = true, features = ["string"] }
dirs = "6.0.0"
kbs = { path = "../../kbs", default-features = false, features = [
    "coco-as-builtin",
    "coco-as-grpc",
    "intel-trust-authority-as",
    "external-plugin",
] }
nix = { version = "0.31.3", features = ["user"] }
openssl.workspace = true
jsonwebtoken.workspace = true
serde.workspace = true
reference-value-provider-service = { path = "../../rvps" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
