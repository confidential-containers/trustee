[package]
name = "trustee-cli"
version.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true
edition.workspace = true

[[bin]]
name = "trustee"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
attestation-service = { path = "../../attestation-service" }
pluggable-cache = "0.1"
clap = { workspace = true, features = ["string"] }
dirs = "6.0.0"
kbs = { path = "../../kbs" }
nix = { version = "0.31.3", features = ["user"] }
openssl.workspace = true
jsonwebtoken.workspace = true
serde.workspace = true
reference-value-provider-service = { path = "../../rvps" }
reqwest = { workspace = true, features = ["default-tls"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
verifier = { path = "../../deps/verifier", default-features = false, features = [
    "snp-verifier",
] }
