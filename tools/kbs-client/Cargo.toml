[package]
name = "kbs-client"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
path = "src/lib.rs"

[[bin]]
name = "kbs-client"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
kbs_protocol = { workspace = true, default-features = false, features = [
    "background_check",
    "passport",
] }
reqwest = { workspace = true, default-features = false, features = [
    "cookies",
    "json",
] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["default-tls"]

# 2 types of native-TLS backend. There are two independent reqwest clients here: kbs-client's own and kbs_protocol's.
#   default-tls: kbs-client's reqwest uses rustls (reqwest 0.13's default), and kbs_protocol stays on vendored OpenSSL -> preserves historical behavior.

#   native-tls: both link the system OpenSSL dynamically (FIPS builds); no vendored openssl-src is compiled into the binary. Cryptobackend calls go through FIPS certified binaries dynamically compiled.
default-tls = ["reqwest/default-tls", "kbs_protocol/native-tls-vendored"]
native-tls = ["reqwest/native-tls", "kbs_protocol/native-tls"]

all-attesters = ["kbs_protocol/all-attesters"]
tdx-attester = ["kbs_protocol/tdx-attester"]
sgx-attester = ["kbs_protocol/sgx-attester"]
az-snp-vtpm-attester = ["kbs_protocol/az-snp-vtpm-attester"]
az-tdx-vtpm-attester = ["kbs_protocol/az-tdx-vtpm-attester"]
snp-attester = ["kbs_protocol/snp-attester"]
csv-attester = ["kbs_protocol/csv-attester"]
cca-attester = ["kbs_protocol/cca-attester"]
se-attester = ["kbs_protocol/se-attester"]
tpm-attester = ["kbs_protocol/tpm-attester"]
nvidia-attester  = ["kbs_protocol/nvidia-attester"]
