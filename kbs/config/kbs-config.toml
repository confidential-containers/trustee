[http_server]
insecure_http = true

[attestation_token]
insecure_header_jwk = true

[attestation_service]
type = "coco_as_builtin"

[attestation_service.attestation_token_broker]
duration_min = 5

[attestation_service.rvps_config]
type = "BuiltIn"

[admin]
authorization_mode = "InsecureAllowAll"

# Unified storage backend configuration
[storage_backend]
storage_type = "LocalFs"

[storage_backend.backends.local_fs]
dir_path = "/opt/confidential-containers/storage"

# Optional session storage type override.
# If omitted, KBS falls back to [storage_backend].storage_type.
# Backend-specific config is always reused from [storage_backend.backends].
# Session state is stored under namespace: "kbs_protocol_session".
#
# session_storage_type = "Memory"

[[plugins]]
name = "resource"
storage_backend_type = "kvstorage"

# Example configuration for HashiCorp Vault KV v1 backend
# Supports both read and write operations with HTTPS support
# [[plugins]]
# name = "resource"
# storage_backend_type = "Vault"
# vault_url = "http://vault.example.com:8200"
# token = "hvs.your-vault-token-here"
# mount_path = "secret"  # Optional, defaults to "secret"
# verify_ssl = false      # Optional, defaults to false
# ca_certs = ["/path/to/ca-bundle.pem"]  # Optional, custom CA certificates
#
# HTTPS Configuration Options:
# - verify_ssl: Set to true to enable SSL certificate verification
# - ca_certs: Array of paths to custom CA certificate files for self-signed or enterprise CA certificates
#
# Note: Token must have read/write permissions for the specified mount path
# Example Vault policy:
# path "secret/*" {
#   capabilities = ["create", "read", "update", "delete", "list"]
# }

[[plugins]]
name = "secretprov"

[plugins.secretprov.ca]
country = "AA"
state = "Default State"
locality = "Default City"
organization = "Default Organization"
org_unit = "Default Unit"
common_name = "grpc-tls CA"
validity_days = 3650

[plugins.secretprov.query]
# Identity params joined to build the store key, e.g. "pod-abc_default"
required = ["name", "ns"]
# Require secret_name + secret_type on every request
spec_required = true

[plugins.secretprov.limits]
symmetric_key_size = 32
rsa_bits = 2048
supported_types = ["tls", "symmetric", "ed25519", "rsa", "p256"]
